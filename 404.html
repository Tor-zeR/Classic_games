<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Not Found — 404 Error | Classic Arcade</title>
  <meta name="description" content="Oops! The arcade level you are looking for has been bypassed or does not exist. Insert a coin to return to the landing page.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://classicarcade.win/404.html">
  <meta name="theme-color" content="#04040c">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
  
  <style>
    /* 404 Page Custom Layout */
    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .error-container {
      text-align: center;
      background: rgba(4, 4, 12, 0.85);
      border: 2px solid var(--magenta);
      box-shadow: 0 0 20px var(--magenta), inset 0 0 15px rgba(255, 0, 255, 0.1);
      padding: 40px;
      max-width: 480px;
      width: 100%;
    }
    .error-code {
      font-size: 28px;
      color: var(--red);
      text-shadow: 0 0 10px var(--red);
      margin-bottom: 24px;
      animation: neon-flicker 5s linear infinite;
    }
    .error-msg {
      font-size: 10px;
      line-height: 2;
      color: var(--cyan);
      text-shadow: 0 0 6px var(--cyan);
      margin-bottom: 32px;
      letter-spacing: 0.1em;
    }
    .home-btn {
      display: inline-block;
      text-decoration: none;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 12px 24px;
      background: transparent;
      border: 2px solid var(--green);
      color: var(--green);
      box-shadow: 0 0 10px var(--green), inset 0 0 8px rgba(0, 255, 68, 0.05);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      animation: pulse 2s ease-in-out infinite;
    }
    @media (hover: hover) {
      .home-btn:hover {
        background: rgba(0, 255, 68, 0.12);
        box-shadow: 0 0 24px var(--green), inset 0 0 16px rgba(0, 255, 68, 0.12);
        transform: scale(1.04);
      }
    }
    .home-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="page">
    <div class="error-container">
      <div class="error-code flicker">ERROR 404</div>
      <div class="error-msg">// LEVEL NOT FOUND //</div>
      <p style="font-size: 8px; line-height: 1.8; margin-bottom: 30px; color: rgba(255, 255, 255, 0.6); letter-spacing: 0.05em;">
        The arcade cabinet page you are looking for has disconnected from the grid or is temporarily out of service.
      </p>
      <a href="/" class="home-btn">► INSERT COIN / GO HOME</a>
    </div>
  </div>

  <!-- Background Grid Animation (Adapted from landing page) -->
  <script>
    (function () {
      const canvas = document.getElementById('bg');
      const ctx    = canvas.getContext('2d');
      let W, H, t = 0;

      const STARS = Array.from({ length: 50 }, (_, i) => ({
        fx: Math.abs(Math.sin(i * 127.3)),
        fy: Math.abs(Math.sin(i * 311.7)),
        sz: 0.4 + Math.abs(Math.sin(i * 53.1)) * 0.9,
        freq:  0.4 + Math.random() * 2.8,
        phase: Math.random() * Math.PI * 2,
      }));

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function draw() {
        ctx.fillStyle = '#04040c';
        ctx.fillRect(0, 0, W, H);

        // Stars
        STARS.forEach((s) => {
          const alpha = 0.2 + 0.6 * Math.sin(t * s.freq + s.phase);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fillRect(s.fx * W, s.fy * H * 0.7, s.sz * 2, s.sz * 2);
        });

        // Grid
        const gridY = H * 0.65;
        const gridH = H - gridY;
        ctx.strokeStyle = 'rgba(255, 0, 255, 0.18)';
        ctx.lineWidth = 1.5;

        // Horizontals
        const lines = 12;
        for (let i = 0; i <= lines; i++) {
          const dy = Math.pow(i / lines, 2) * gridH;
          ctx.beginPath();
          ctx.moveTo(0, gridY + dy);
          ctx.lineTo(W, gridY + dy);
          ctx.stroke();
        }

        // Verticals
        const vLines = 20;
        for (let i = 0; i <= vLines; i++) {
          const x = (i / vLines) * W;
          ctx.beginPath();
          ctx.moveTo(x, gridY);
          ctx.lineTo(W / 2 + (x - W / 2) * 2.2, H);
          ctx.stroke();
        }

        t += 0.016;
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
